[project]
name = "discord-ext-songbird"
requires-python = ">=3.14"
dependencies = [
    "discord.py>=2.7.1,<3",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Framework :: AsyncIO",
    "Topic :: Multimedia :: Sound/Audio",
    "Typing :: Typed",
]
keywords = ["discord", "discord.py", "voice", "audio", "songbird", "realtime", "streaming"]
readme = "README.md"
dynamic = ["version", "description", "authors", "license"]

[project.optional-dependencies]
arrow = ["pyarrow>=26.0.0"]
arro3 = ["arro3-core>=0.9.1"]

[project.urls]
Repository = "https://github.com/sizumita/discord-ext-songbird"
Documentation = "https://github.com/sizumita/discord-ext-songbird/tree/master/docs"

[build-system]
requires = ["maturin>=1.15.0,<2"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "ruff==0.17.2",
    "ty==0.0.92",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "numpy==2.5.4",
    "pyarrow==26.0.0",
    "arro3-core==0.9.1",
    "websockets==17.3",
    "maturin==1.15.0",
]

[tool.maturin]
python-source = "py-src"
module-name = "discord.ext.songbird.native"
exclude = ["tests/**", "examples/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "real_only: needs the Rust implementation (skipped on the pure-Python fake)",
    "fake_only: relies on the pure-Python fake's simplifications",
]
filterwarnings = [
    # discord.py 2.7.1 itself still calls asyncio.iscoroutinefunction (deprecated in 3.14).
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:discord",
]

[tool.ruff]
include = [
    "py-src/**/*.py",
    "py-src/**/*.pyi",
    "examples/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
]
line-length = 120
target-version = "py314"
# Generated by `cargo run --bin stub_gen`; never formatted or edited by hand.
extend-exclude = ["py-src/discord/ext/songbird/native"]

[tool.ruff.lint]
select = ["F", "I"]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

[tool.ty.src]
include = ["py-src", "examples", "tests", "scripts"]

[tool.ty.environment]
python-version = "3.14"
# The package itself is found through the editable install (`maturin develop` writes a .pth);
# listing py-src here would make its `discord/` namespace directory shadow discord.py.
extra-paths = ["tests"]

# The LFM2.5-Audio examples import torch and liquid_audio, which are not dev dependencies (only the
# model wrappers use them; the bot code is still checked).
[[tool.ty.overrides]]
include = ["examples/lfm2_audio/**"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
