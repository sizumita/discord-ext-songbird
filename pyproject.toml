[project]
name = "discord-ext-songbird"
requires-python = ">=3.14"
dependencies = [
    "discord.py>=2.7.1,<3",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
]
readme = "README.md"
dynamic = ["version", "description", "authors", "license"]

[project.optional-dependencies]
arrow = ["pyarrow>=26.0.0"]
arro3 = ["arro3-core>=0.9.1"]

[build-system]
requires = ["maturin>=1.15.0,<2"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "ruff==0.17.2",
    "ty==0.0.92",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "numpy==2.5.4",
    "pyarrow==26.0.0",
    "arro3-core==0.9.1",
    "websockets==17.3",
    "maturin==1.15.0",
]

[tool.maturin]
python-source = "py-src"
module-name = "discord.ext.songbird.native"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
include = ["py-src/**/*.py", "py-src/**/*.pyi", "examples/**/*.py"]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["I"]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

[tool.ty.src]
include = ["py-src", "examples"]

[tool.ty.environment]
extra-paths = ["py-src"]
